<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071c2f">
  <title>Alejandro Maldonado | COMECA Marine</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box}
    :root{
      --navy:#071c2f;
      --navy2:#0c2943;
      --white:#fff;
      --soft:#eaf1f6;
      --muted:#a9b8c5;
      --line:rgba(255,255,255,.16);
    }
    html,body{
      margin:0;
      min-height:100%;
      font-family:"Montserrat",Arial,sans-serif;
      background:
        radial-gradient(circle at 85% 5%,rgba(22,96,145,.45),transparent 35%),
        linear-gradient(145deg,var(--navy2),var(--navy));
      color:var(--white);
    }
    body{min-height:100vh}
    .page{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      width:min(100%,430px);
      min-height:720px;
      border-radius:28px;
      padding:34px 28px 26px;
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),
        rgba(4,24,40,.88);
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 25px 65px rgba(0,0,0,.36);
      backdrop-filter:blur(10px);
    }
    .card:before{
      content:"";
      position:absolute;
      width:320px;height:320px;
      right:-155px;top:-100px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.08);
    }
    .card:after{
      content:"";
      position:absolute;
      width:250px;height:250px;
      left:-170px;bottom:-85px;
      border-radius:50%;
      background:rgba(17,94,142,.18);
    }
    .brand,.profile,.contact-list,.actions,footer{position:relative;z-index:1}
    .brand{display:flex;justify-content:flex-end;margin-bottom:56px}
    .brand-mark{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:.9}
    .brand-mark span{font-size:21px;font-weight:800;letter-spacing:.05em}
    .brand-mark small{
      font-size:9px;font-weight:700;letter-spacing:.35em;margin-right:-.35em;
      margin-top:6px;color:#9ec5dd
    }
    .eyebrow{margin:0 0 10px;color:#8fc4e6;font-weight:700;letter-spacing:.2em;font-size:11px}
    h1{margin:0;font-size:clamp(42px,11vw,58px);line-height:.94;letter-spacing:-.045em;font-weight:800}
    .role{margin:18px 0 34px;color:var(--soft);font-size:15px;font-weight:500}
    .contact-list{border-top:1px solid var(--line)}
    .contact-row{
      display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:center;
      padding:18px 0;color:var(--white);text-decoration:none;border-bottom:1px solid var(--line);
      transition:transform .18s ease,opacity .18s ease
    }
    .contact-row:hover{transform:translateX(4px);opacity:.9}
    .icon{
      width:42px;height:42px;display:grid;place-items:center;border-radius:50%;
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:17px
    }
    .contact-row small{
      display:block;color:var(--muted);margin-bottom:4px;font-size:10px;
      text-transform:uppercase;letter-spacing:.12em
    }
    .contact-row strong{display:block;font-size:13px;font-weight:600;overflow-wrap:anywhere}
    .actions{margin-top:26px}
    .primary-button{
      display:flex;justify-content:center;align-items:center;min-height:52px;border-radius:14px;
      background:var(--white);color:var(--navy);font-weight:800;font-size:13px;text-decoration:none;
      box-shadow:0 10px 28px rgba(0,0,0,.18)
    }
    footer{
      margin-top:30px;color:#8297a7;font-size:9px;letter-spacing:.12em;
      text-transform:uppercase;text-align:center
    }
    .dot{margin:0 8px}
    @media(max-width:480px){
      .page{padding:0}
      .card{min-height:100vh;width:100%;border-radius:0;border:0;padding:30px 24px 24px}
      .brand{margin-bottom:48px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">
        <div class="brand-mark">
          <span>COMECA</span>
          <small>MARINE</small>
        </div>
      </div>

      <div class="profile">
        <p class="eyebrow">COMECA MARINE</p>
        <h1>Alejandro<br>Maldonado</h1>
        <p class="role">Jefe de Agencia</p>
      </div>

      <div class="contact-list">
        <a class="contact-row" href="tel:+50244773700">
          <span class="icon">☎</span>
          <span>
            <small>Teléfono</small>
            <strong>+502 4477 3700</strong>
          </span>
        </a>

        <a class="contact-row" href="mailto:amaldonado@comeca.com.gt">
          <span class="icon">✉</span>
          <span>
            <small>Correo</small>
            <strong>amaldonado@comeca.com.gt</strong>
          </span>
        </a>

        <a class="contact-row" href="https://wa.me/50244773700" target="_blank" rel="noopener">
          <span class="icon">◉</span>
          <span>
            <small>WhatsApp</small>
            <strong>Enviar mensaje</strong>
          </span>
        </a>
      </div>

      <div class="actions">
        <a class="primary-button" href="alejandro-maldonado.vcf" download>Guardar contacto</a>
      </div>

      <footer>
        <span>COMECA</span><span class="dot">•</span><span>Guatemala</span>
      </footer>
    </section>
  </main>
</body>
</html>
